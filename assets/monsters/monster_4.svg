<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200' width='200' height='200'>
      <defs>
        <radialGradient id='bg4' cx='50%' cy='50%' r='70%'>
          <stop offset='0%' stop-color='#292524'/>
          <stop offset='100%' stop-color='#0c0a09'/>
        </radialGradient>
      </defs>
      <rect width='200' height='200' rx='28' fill='url(#bg4)'/>
      <!-- Rock Shoulders -->
      <polygon points='20,165 40,110 80,125 70,170' fill='#44403c'/>
      <polygon points='180,165 160,110 120,125 130,170' fill='#44403c'/>
      <!-- Rock Head -->
      <polygon points='60,70 140,70 150,130 130,160 70,160 50,130' fill='#57534e'/>
      <!-- Runes on Brow -->
      <path d='M75,85 L125,85' stroke='#38bdf8' stroke-width='3' stroke-linecap='round'/>
      <path d='M100,75 L100,95' stroke='#38bdf8' stroke-width='3' stroke-linecap='round'/>
      <!-- Glowing Cyan Eye Slits -->
      <polygon points='75,105 92,105 88,112 75,110' fill='#38bdf8' filter='drop-shadow(0 0 5px #0284c7)'/>
      <polygon points='125,105 108,105 112,112 125,110' fill='#38bdf8' filter='drop-shadow(0 0 5px #0284c7)'/>
      <!-- Rock Mouth Slit -->
      <polygon points='80,135 120,135 115,142 85,142' fill='#1c1917'/>
      <line x1='90' y1='135' x2='90' y2='142' stroke='#38bdf8' stroke-width='2'/>
      <line x1='100' y1='135' x2='100' y2='142' stroke='#38bdf8' stroke-width='2'/>
      <line x1='110' y1='135' x2='110' y2='142' stroke='#38bdf8' stroke-width='2'/>
      <!-- Cracks with legal light -->
      <path d='M130,95 L145,115 L138,135' stroke='#38bdf8' stroke-width='2' fill='none'/>
      <text x='100' y='185' font-family='sans-serif' font-weight='900' font-size='12' fill='#38bdf8' text-anchor='middle'>ẢI 4 • KHỔNG LỒ ÁN LỆ</text>
    </svg>